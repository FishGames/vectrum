# NeoForge 1.20.1 liest noch META-INF/mods.toml (die Umbenennung in neoforge.mods.toml kam erst mit 1.20.2+).
# Die Abhaengigkeit auf "forge"/"neoforge" ist hier bewusst weggelassen, damit der Mod-Id-Name des Loaders
# (in 1.20.1 noch "forge") keine Ladefehler verursacht.
modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"
