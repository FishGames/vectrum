# NeoForge 1.20.1 mod metadata (META-INF/mods.toml)
modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

# Optional dependency: Mekanism (gas module)
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    versionRange="[10.0,)"
    ordering="AFTER"
    side="BOTH"
